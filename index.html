<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한국사">
<meta name="theme-color" content="#F4F5F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>일제 강점기 한국사 · 시험 대비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F7; --surface:#FFFFFF; --ink:#1A2233; --muted:#5E6878; --line:#DCE1E8;
  --red:#C8322B; --red-soft:#FBE9E7; --green:#2E7A55; --green-soft:#E6F3EC;
  --hl:#FFE872; --accent:#24407A; --accent-soft:#E7ECF6;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pen:"Nanum Pen Script","Gowun Batang",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12161D; --surface:#1A2029; --ink:#E6EAF0; --muted:#9AA4B2; --line:#2A323E;
    --red:#FF6B5E; --red-soft:#3A1F1E; --green:#5CC08E; --green-soft:#16302A;
    --hl:rgba(255,220,80,.38); --accent:#9AB6F2; --accent-soft:#1E2A42;
  }
}
:root[data-theme="dark"]{
  --paper:#12161D; --surface:#1A2029; --ink:#E6EAF0; --muted:#9AA4B2; --line:#2A323E;
  --red:#FF6B5E; --red-soft:#3A1F1E; --green:#5CC08E; --green-soft:#16302A;
  --hl:rgba(255,220,80,.38); --accent:#9AB6F2; --accent-soft:#1E2A42;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:baseline;gap:10px}
header.top h1{font-family:var(--serif);font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:.8rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--red)}

.view{display:none}
.view.on{display:block}

/* controls */
.bar{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;padding:4px 0 10px;font-size:.88rem;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem}

/* timeline */
.era{margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.era h2{font-family:var(--serif);font-size:1.2rem;margin:0}
.era span{font-size:.82rem;color:var(--muted)}
.yr{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.yr .y{font-family:var(--serif);font-weight:700;font-size:1.25rem;line-height:1.3;cursor:default}
.hideyear .yr .y{color:transparent;background:var(--line);border-radius:6px;cursor:pointer;height:1.6rem;user-select:none}
.hideyear .yr .y.peek{color:var(--ink);background:none}
.ev{position:relative;padding:3px 0 3px 14px;font-size:.95rem}
.ev::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.ev.star::before{background:var(--red)}
.ev .m{color:var(--muted);font-size:.78rem;margin-right:4px;font-variant-numeric:tabular-nums}
.ev .c{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--muted);white-space:nowrap}
.empty{padding:30px 0;color:var(--muted);text-align:center}

/* notes */
.focus{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:14px 16px;margin:16px 0}
.focus h2{font-family:var(--serif);font-size:1.1rem;margin:0 0 8px}
.focus ol{margin:0;padding-left:1.3em}
.focus li{margin:3px 0}
.focus a{color:inherit;text-decoration-color:var(--red);text-underline-offset:3px}
.unit{margin-top:22px}
.unit>h2{font-family:var(--serif);font-size:1.25rem;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
details.topic>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary::before{content:"+";font-family:var(--serif);color:var(--muted);width:1em;flex:none}
details.topic[open]>summary::before{content:"−"}
details.topic>summary .n{color:var(--muted);font-weight:400;font-size:.85rem;flex:none}
.body{padding:0 16px 14px}
.body h3{font-family:var(--serif);font-size:1.02rem;margin:16px 0 6px}
.body ul{margin:0;padding-left:1.15em}
.body li{margin:4px 0}
.blank{background:linear-gradient(transparent 55%,var(--hl) 55%);font-weight:600;padding:0 1px;border-radius:2px}
.hideblank .blank{color:transparent;background:var(--line);cursor:pointer;border-radius:4px}
.hideblank .blank.peek{color:inherit;background:linear-gradient(transparent 55%,var(--hl) 55%)}
.red{font-family:var(--pen);color:var(--red);font-size:1.32em;line-height:1.25}
li.rline{list-style:none;margin-left:-1.15em;padding:2px 0 2px 10px;border-left:3px solid var(--red)}
li.gline{list-style:none;margin-left:-1.15em;padding:2px 0 2px 10px;border-left:3px solid var(--green);color:var(--green);font-size:.92rem}
li.tip{list-style:none;margin-left:-1.15em;background:var(--accent-soft);padding:8px 10px;border-radius:8px;font-size:.9rem}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;width:100%;min-width:340px;font-size:.86rem;word-break:keep-all}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--paper);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:6px 0 0}
.legend b{font-weight:400}

/* quiz */
.modes{display:grid;gap:10px;margin:16px 0}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.mode strong{display:block;font-family:var(--serif);font-size:1.05rem}
.mode span{color:var(--muted);font-size:.86rem}
.mode.main{border-color:var(--ink);border-width:2px}
.sect{font-family:var(--serif);font-size:1rem;margin:22px 0 4px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid .mode{padding:10px 12px}
.fgrid .mode strong{font-size:.95rem}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;font-size:.85rem;color:var(--muted)}
.qhead button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.82rem}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin:12px 0}
.qtag{font-size:.75rem;color:var(--red);font-weight:600}
.qtext{font-weight:600;font-size:1.02rem;margin:4px 0 12px}
.ctx{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px;white-space:pre-line;font-family:var(--serif);font-size:.95rem;background:var(--paper)}
.bogi{border:1px solid var(--ink);border-radius:6px;padding:14px 12px 8px;margin:14px 0 12px;position:relative;font-size:.93rem}
.bogi::before{content:"보기";position:absolute;top:-.8em;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 8px;font-size:.8rem}
.bogi div{margin:3px 0}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;font-size:.95rem}
.opt .no{flex:none;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.ox{grid-template-columns:1fr 1fr}
.ox .opt{justify-content:center;font-family:var(--serif);font-size:1.6rem;font-weight:700;padding:14px}
.ex{margin-top:14px;padding:12px;border-radius:10px;background:var(--paper);font-size:.92rem;border-left:4px solid var(--green)}
.ex.bad{border-left-color:var(--red)}
.ex b{display:block;margin-bottom:2px}
.next{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer}
.result{text-align:center;padding:30px 0}
.result .big{font-family:var(--serif);font-size:3.4rem;font-weight:700;line-height:1}
.result p{color:var(--muted)}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:.84rem;color:var(--muted);margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>일제 강점기 한국사</h1><span class="sub">김포고 1학년 2학기 1차 대비</span></div></header>

<main class="wrap">
  <!-- 연표 -->
  <section class="view on" id="v-time" aria-label="연표">
    <div class="bar" id="catbar" role="toolbar" aria-label="분류"></div>
    <input type="search" id="tsearch" placeholder="사건, 인물, 단체 검색 (예: 지청천, 신간회)">
    <div class="toggles">
      <label><input type="checkbox" id="starOnly"> 핵심만 보기</label>
      <label><input type="checkbox" id="hideYear"> 연도 가리기 (탭하면 보임)</label>
    </div>
    <div id="tlist"></div>
  </section>

  <!-- 정리 -->
  <section class="view" id="v-note" aria-label="내용 정리">
    <div class="focus">
      <h2>선생님이 강조한 8가지</h2>
      <ol>
        <li><a href="#t18">좌파·우파 구분</a> (1930년대 중국 관내 단체)</li>
        <li><a href="#" data-go="time">연도 어느 정도 알기</a> → 연표 탭</li>
        <li><a href="#t10">의열단원 각자의 활동</a></li>
        <li><a href="#t11">배움책 17쪽 빨간 필기 구호</a></li>
        <li><a href="#t12">신간회</a></li>
        <li><a href="#t18">조선 의용대 활동</a></li>
        <li><a href="#t08">운동 단체</a> (1910년대 국내외, 사회 운동)</li>
        <li><a href="#t17">한국 독립군 vs 조선 혁명군</a></li>
      </ol>
      <div class="legend"><b><span class="red">빨간 펜</span> = 선생님 필기</b><b style="color:var(--green)">초록 = 내 필기</b><b><span class="blank">형광펜</span> = 배움책 빈칸</b></div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="hideBlank"> 빈칸 가리기 (탭하면 보임)</label>
      <label><input type="checkbox" id="openAll"> 전부 펼치기</label>
    </div>
    <div id="notes"></div>
  </section>

  <!-- 문제 -->
  <section class="view" id="v-quiz" aria-label="문제 풀이">
    <div id="quiz"></div>
  </section>
</main>

<nav class="tabs" aria-label="메뉴"><div class="in" role="tablist">
  <button role="tab" data-tab="time" aria-selected="true">연표</button>
  <button role="tab" data-tab="note" aria-selected="false">정리</button>
  <button role="tab" data-tab="quiz" aria-selected="false">문제</button>
</div></nav>

<script>
/* ================= 연표 데이터 [연도, 월, 분류, 핵심(1), 짧은이름(문제용), 설명] ================= */
const T = [
[1910,'','통치',1,'국권 피탈','국권 피탈 — 일제 식민 통치 시작'],
[1910,'','통치',1,'조선 총독부 설치','조선 총독부 설치 — 총독은 현역 육해군 대장, 일왕 직속. 자문 기구 중추원(친일파)'],
[1910,'','통치',1,'헌병 경찰제 실시','헌병 경찰제 — 헌병이 경찰·치안·일반 행정까지 담당'],
[1910,'12','통치',1,'범죄 즉결례 시행','범죄 즉결례 — 헌병 경찰이 일부 범죄를 즉결 심판'],
[1910,'12','경제',1,'회사령 공포','회사령 — 회사 설립 시 조선 총독의 허가 필요(허가제)'],
[1910,'','경제',0,'','임시 토지 조사국 설치 → 토지 조사 사업(1910~1918)'],
[1910,'','국외',1,'대한인 국민회 결성','미주 대한인 국민회 — 미주 민족 운동 단체 통합'],
[1911,'','국외',1,'경학사 조직','서간도 삼원보 경학사·신흥 강습소 — 신민회 이회영·이상룡'],
[1911,'','국외',0,'권업회 조직','연해주 신한촌 권업회, 권업신문 발간'],
[1912,'3','통치',1,'조선 태형령 제정','조선 태형령(한국인에게만 태형), 경찰범 처벌 규칙'],
[1912,'8','경제',1,'토지 조사령 공포','토지 조사령 — 정해진 기간 안에 직접 신고해야 소유 인정'],
[1912,'','국내',1,'독립 의군부 조직','독립 의군부 — 임병찬, 고종 밀지, 복벽주의, 국권 반환 요구서 계획 중 발각'],
[1912,'','국외',0,'동제사 결성','상하이 동제사 — 신규식, 공화주의 임시 정부 주장'],
[1914,'','세계',1,'제1차 세계 대전 발발','제1차 세계 대전 — 일본은 영일 동맹 내세워 협상국 측 참전'],
[1914,'','국외',1,'대한 광복군 정부 조직','연해주 대한 광복군 정부 — 이상설·이동휘'],
[1914,'','경제',0,'','호남선·경원선 완공 (X자형 간선 철도망, 호남선부터 시작)'],
[1915,'','국내',1,'대한 광복회 조직','대한 광복회 — 박상진, 대구, 공화정 목표, 군대식 조직, 군자금 모집, 친일파 처단'],
[1915,'12','경제',0,'','조선 광업령 — 광업권 제한, 자원 독점'],
[1917,'','세계',1,'러시아 혁명','러시아 혁명 — 레닌 등 사회주의 혁명 정부'],
[1918,'','경제',1,'조선 식산 은행 설립','조선 식산 은행 설립 / 토지 조사 사업 완료'],
[1918,'','세계',1,'민족 자결주의 제창','윌슨 민족 자결주의 — 패전국 식민지에만 적용(한국 X)'],
[1918,'','국외',1,'신한 청년당 결성','상하이 신한 청년당 — 김규식·여운형, 파리 강화 회의에 김규식 파견'],
[1918,'','세계',0,'','제1차 세계 대전 종전(협상국 승리) / 일본 쌀 소동'],
[1919,'','국외',0,'대한 독립 선언','대한 독립 선언 — 만주 지린, 민족 운동가 39명'],
[1919,'2','국외',1,'2·8 독립 선언','2·8 독립 선언 — 도쿄 한국인 유학생(조선 청년 독립단)'],
[1919,'','세계',0,'','코민테른(국제 공산당) 결성 — 레닌'],
[1919,'3','국내',1,'3·1 운동','3·1 운동 — 고종 인산일 계기, 태화관(민족 대표 33인)·탑골 공원, 일제 강점기 최대 규모'],
[1919,'3','임정',0,'','대한 국민 의회(연해주)'],
[1919,'4','임정',0,'','한성 정부(국내)·상하이 임시 정부'],

{tg:['독립군','단체'],q:'3부에 대한 설명으로 옳은 것은?',o:['간도 참변 이전에 성립하였다.','민정과 군정 조직을 갖춘 공화주의 자치 정부 성격을 띠었다.','김원봉이 이끌었다.','중국 관내 상하이에서 조직되었다.','사회주의 계열만으로 구성되었다.'],a:1,ex:'자유시 참변 후 참의부·정의부·신민부, 삼권 분립 공화주의 자치 정부(학습지).'},
{tg:['의열단'],q:'다음 활동을 한 의열단원은?',ctx:'1923년 1월 종로 경찰서에 폭탄을 던진 뒤, 남산 일대에서 수많은 일본 경찰과 총격전을 벌이다 순국하였다.',o:['박재혁','김익상','김상옥','김지섭','나석주'],a:2,ex:'김상옥 = 종로 경찰서(1923.1). 박재혁 부산 경찰서, 김익상 조선 총독부, 김지섭 일본 궁성, 나석주 동양 척식 주식회사.'},
{tg:['의열단'],q:'1926년 12월 동양 척식 주식회사에 폭탄을 던진 의열단원은?',o:['박재혁','김익상','김상옥','김지섭','나석주'],a:4,ex:'나석주 = 동양 척식 주식회사(1926.12).'},
{tg:['의열단'],q:'의열단원과 활동을 옳게 연결한 것은?',o:['박재혁 — 조선 총독부','김익상 — 조선 총독부','김상옥 — 일본 궁성','김지섭 — 종로 경찰서','나석주 — 부산 경찰서'],a:1,ex:'박재혁 부산 경찰서 / 김익상 조선 총독부 / 김상옥 종로 경찰서 / 김지섭 일본 궁성 / 나석주 동척.'},
{tg:['의열단'],q:'부산 경찰서에 폭탄을 던진 의열단원은?',o:['김지섭','나석주','박재혁','김상옥','윤봉길'],a:2,ex:'박재혁(1920.9). 윤봉길은 한인 애국단.'},
{tg:['의열단'],q:'일본 도쿄의 궁성에 폭탄을 던진 의열단원은?',o:['이봉창','김지섭','김익상','나석주','김상옥'],a:1,ex:'김지섭(1924.1). 이봉창은 한인 애국단 — 일왕 마차에 수류탄(1932).'},
{tg:['의열단','연도'],q:'의열단원들의 활동을 일어난 순서대로 나열한 것은?',o:['박재혁 → 김익상 → 김상옥 → 김지섭 → 나석주','김익상 → 박재혁 → 김상옥 → 나석주 → 김지섭','박재혁 → 김상옥 → 김익상 → 김지섭 → 나석주','김상옥 → 박재혁 → 김지섭 → 김익상 → 나석주','박재혁 → 김익상 → 김지섭 → 김상옥 → 나석주'],a:0,ex:'1920.9 박재혁 → 1921.9 김익상 → 1923.1 김상옥 → 1924.1 김지섭 → 1926.12 나석주.'},
{tg:['의열단'],q:'(가) 단체에 대한 설명으로 옳은 것은?',ctx:'(가) 은/는 1919년 김원봉이 만주에서 조직하였다. 조선 총독, 친일파 등을 암살하고 식민 기관을 파괴하고자 하였다.',o:['김구가 상하이에서 조직하였다.','「조선 혁명 선언」을 활동 지침으로 삼았다.','이봉창, 윤봉길이 소속되어 활동하였다.','복벽주의를 내세워 의병 봉기를 계획하였다.','광주 학생 항일 운동에 진상 조사단을 파견하였다.'],a:1,ex:'(가) 의열단. 김구·이봉창·윤봉길 = 한인 애국단, 복벽주의 = 독립 의군부, 진상 조사단 = 신간회.'},
{tg:['의열단'],q:'1920년대 후반 이후 의열단의 변화로 옳은 것은?',o:['한국광복군을 창설하였다.','동북 항일 연군에 편입되었다.','국민 대표 회의를 소집하였다.','김원봉 등이 황푸 군관 학교에 입학해 군사 교육을 받았다.','대한 광복회를 계승하여 공화정 수립을 목표로 삼았다.'],a:3,ex:'개인 폭력 투쟁의 한계 → 조직적 무장 투쟁 준비 → 황푸 군관 학교 입학 → 조선 혁명 군사 정치 간부 학교.'},
{tg:['의열단'],q:'다음 선언에 나타난 주장으로 옳은 것은?',ctx:'민중은 우리 혁명의 대본영이다. 폭력은 우리 혁명의 유일한 무기이다. 우리는 민중 속으로 가서 민중과 손을 맞잡아 끊임없는 폭력, 암살, 파괴, 폭동으로써 강도 일본의 통치를 타도한다.',o:['외교 활동으로 독립을 얻어야 한다.','실력을 먼저 길러야 독립할 수 있다.','일제가 허용하는 범위에서 자치를 추구해야 한다.','민중의 직접 혁명으로 일제를 타도해야 한다.','국제 연맹의 위임 통치를 받아야 한다.'],a:3,ex:'신채호 「조선 혁명 선언」(1923) — 외교론·준비론 비판, 민중 직접 혁명.'},
{tg:['구호'],q:'다음 구호를 내건 운동으로 옳은 것은?',ctx:'“내 살림 내 것으로”\n“조선 사람 조선 것”',o:['자치 운동','물산 장려 운동','민립 대학 설립 운동','문자 보급 운동','브나로드 운동'],a:1,ex:'배움책 17쪽 빨간 필기 — 물산 장려 운동.'},
{tg:['구호'],q:'다음 구호와 관련된 운동에 대한 설명으로 옳은 것은?',ctx:'“한 민족 1천만이 한 사람 1원씩”',o:['조만식 등이 평양에서 시작하였다.','조선일보가 한글 교재를 배포하였다.','조선 민립 대학 기성회가 중심이 되어 모금 운동을 벌였다.','사회주의자들이 주도하여 계급 해방을 추구하였다.','경성 제국 대학 설립으로 목표를 이루었다.'],a:2,ex:'민립 대학 설립 운동(이상재). 경성 제국 대학은 일제가 운동을 무마하려고 세운 것.'},
{tg:['구호'],q:'다음 표어를 내걸고 문자 보급 운동을 전개한 언론 기관은?',ctx:'“아는 것이 힘, 배워야 산다”',o:['조선일보','동아일보','매일신보','독립신문','시대일보'],a:0,ex:'조선일보 문자 보급 운동(1929~). 동아일보는 브나로드 운동.'},
{tg:['구호'],q:'밑줄 친 ‘이 운동’에 대한 설명으로 옳은 것은?',ctx:'‘배우자, 가르치자, 다 함께 브나로드’라는 구호 아래 방학을 맞은 학생들이 농촌으로 가서 야학을 열었다. 이 운동의 ‘브나로드’는 러시아어로 ‘민중 속으로’라는 뜻이다.',o:['조선일보가 1929년부터 주도하였다.','동아일보가 주도하였고, 일제가 강제로 중단시켰다.','토산품 애용과 절약 생활을 강조하였다.','고등 교육 기관 설립을 목표로 하였다.','조선 총독부의 지원을 받아 전개되었다.'],a:1,ex:'브나로드 운동 = 동아일보(1931~), 농민 민족의식 고취를 이유로 일제가 중단.'},
{tg:['구호'],q:'물산 장려 운동에 대한 당시 비판으로 가장 적절한 것은?',o:['“일제가 허용하는 범위에서 자치를 해야 한다.”','“토산품 가격만 올라 자본가만 이익을 본다.”','“대학 설립보다 초등 교육이 먼저다.”','“무장 투쟁만이 유일한 길이다.”','“한글보다 일본어 교육이 필요하다.”'],a:1,ex:'토산품 가격 폭등 → 사회주의자들이 ‘자본가(중산 계급)의 이기적 운동’이라고 비판.'},
{tg:['구호'],q:'구호와 운동을 옳게 짝지은 것은?',o:['“아는 것이 힘, 배워야 산다” — 브나로드 운동','“내 살림 내 것으로” — 민립 대학 설립 운동','“한 민족 1천만이 한 사람 1원씩” — 물산 장려 운동','“배우자, 가르치자, 다 함께” — 동아일보의 농촌 계몽 운동','“조선 사람 조선 것” — 문자 보급 운동'],a:3,ex:'아는 것이 힘 = 문자 보급(조선일보) / 내 살림·조선 사람 = 물산 장려 / 1천만 1원 = 민립 대학.'},
{tg:['구호','단체'],q:'조선 물산 장려회에 대한 설명으로 옳은 것은?',o:['이상재 등이 서울에서 조직하였다.','1920년 평양에서 조만식 등이 조직하였다.','사회주의 계열이 조직한 노동 단체이다.','회사령 제정에 맞서 1910년 조직되었다.','문맹 퇴치를 위해 한글 교재를 발행하였다.'],a:1,ex:'이상재 = 민립 대학 기성회. 물산 장려회는 1920 평양 조만식.'},
{tg:['신간회'],q:'다음 강령을 내세운 단체에 대한 설명으로 옳은 것은?',ctx:'1. 우리는 정치·경제적 각성을 촉진함.\n2. 우리는 단결을 공고히 함.\n3. 우리는 기회주의를 일체 부인함.',o:['타협적 민족주의 세력과 사회주의 세력이 연합하였다.','6·10 만세 운동을 주도하였다.','광주 학생 항일 운동에 진상 조사단을 파견하였다.','조선 총독부에 협력하여 자치 의회를 추진하였다.','1919년 상하이에서 조직되었다.'],a:2,ex:'신간회. ①은 ‘비타협적’이 맞음(기출 함정). 6·10 만세 운동(1926)은 신간회 창립(1927) 전.'},
{tg:['신간회'],q:'신간회 강령의 ‘기회주의’가 가리키는 세력은?',o:['사회주의 세력','비타협적 민족주의 세력','타협적 민족주의 세력(자치 운동)','의열단','대한민국 임시 정부'],a:2,ex:'기회주의 = 이광수·최린 등 자치 운동을 벌인 타협적 민족주의 세력.'},
{tg:['신간회'],q:'신간회 창립의 직접적 계기가 된 것은?',o:['2·8 독립 선언','정우회 선언','조선 혁명 선언','「민족적 경륜」','카이로 선언'],a:1,ex:'정우회 선언(1926): 사회주의 계열이 비타협적 민족주의와의 연대를 주장 → 신간회(1927).'},
{tg:['신간회'],q:'신간회 해소의 배경으로 옳지 않은 것은?',o:['코민테른의 노선 변화(12월 테제)','중국 제1차 국공 합작 결렬','새 지도부의 타협적 움직임','일부 사회주의 세력의 해소 주장','일제의 치안 유지법 제정'],a:4,ex:'치안 유지법은 1925년, 신간회 창립(1927)보다 앞.'},
{tg:['신간회'],q:'신간회에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?',bg:['ㄱ. 회장으로 이상재를 선출하였다.','ㄴ. 국내뿐 아니라 만주·일본에도 지회를 두었다.','ㄷ. 민중 대회를 열어 광주 학생 항일 운동을 전국으로 확산시켰다.','ㄹ. 1931년 전체 대회에서 해소를 결정하였다.'],o:['ㄱ, ㄴ','ㄴ, ㄷ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ','ㄱ, ㄷ, ㄹ'],a:3,ex:'민중 대회는 사전에 발각되어 열리지 못함 → 간부 체포.'},
{tg:['신간회','단체'],q:'신간회 창립의 영향으로 조직된 여성 단체는?',o:['조선 여자 교육회','근우회','조선 여성 동우회','조선 여자 기독교 청년 연합회','천도교 소년회'],a:1,ex:'근우회(1927) — 여성계의 민족 협동 전선.'},
{tg:['신간회'],q:'신간회의 의의로 가장 적절한 것은?',o:['국외에서 조직된 최초의 무장 독립군이다.','비타협적 민족주의와 사회주의가 결성한 국내 최대 규모의 합법 항일 단체이다.','우리 역사상 최초의 민주 공화제 정부이다.','민족 말살 통치에 맞서 한글을 지켰다.','일본 의회에 한국인 대표 참여를 이끌어 냈다.'],a:1},
{tg:['신간회','연도'],q:'(가)~(라)를 일어난 순서대로 옳게 나열한 것은?',ctx:'(가) 정우회 선언\n(나) 신간회 해소\n(다) 광주 학생 항일 운동\n(라) 신간회 창립',o:['(가) - (라) - (다) - (나)','(라) - (가) - (다) - (나)','(가) - (다) - (라) - (나)','(라) - (다) - (가) - (나)','(다) - (가) - (라) - (나)'],a:0,ex:'정우회 선언 1926 → 신간회 1927 → 광주 학생 1929 → 해소 1931.'},
{tg:['의용대'],q:'조선 의용대에 대한 설명으로 옳은 것은?',o:['김구가 조직한 한인 애국단의 군대이다.','1938년 조선 민족 전선 연맹이 중국 국민당의 지원을 받아 창설하였다.','남만주에서 중국 의용군과 영릉가 전투를 벌였다.','영국군의 요청으로 인도·미얀마 전선에 파견되었다.','동북 항일 연군 내 한인 유격대로 보천보를 공격하였다.'],a:1,ex:'③ 조선 혁명군, ④ 한국광복군, ⑤ 조국 광복회(동북 항일 연군).'},
{tg:['의용대'],q:'조선 의용대의 주요 활동으로 옳은 것은?',o:['국내 진공 작전을 계획하였다.','중국 국민당의 대일 전선에서 정보 수집·포로 심문 등 후방 공작을 하였다.','청산리에서 일본군을 크게 격파하였다.','일본 국왕의 마차에 수류탄을 던졌다.','연통제를 운영하였다.'],a:1},

{tg:['독립군'],q:'조선 혁명군에 대한 설명으로 옳은 것은?',o:['지청천이 총사령관이었다.','북만주에서 중국 호로군과 연합하였다.','양세봉의 지휘 아래 중국 의용군과 영릉가·흥경성 전투에서 승리하였다.','대전자령 전투에서 승리하였다.','혁신 의회 계열 한국 독립당의 군대였다.'],a:2,ex:'조선 혁명군 = 남·양·의 (남만주·양세봉·의용군), 영릉가·흥경성.'},

{tg:['독립군','단체'],q:'3부 통합 운동의 결과로 옳은 것은?',o:['국민부는 북만주에서 한국 독립당을 결성하였다.','혁신 의회는 남만주에서 조선 혁명당을 결성하였다.','국민부는 남만주에서 조선 혁명당·조선 혁명군을 결성하였다.','3부는 완전히 하나의 단체로 통합되었다.','혁신 의회 계열 군대는 양세봉이 이끌었다.'],a:2,ex:'작년 기출 18번 함정! 국민부(남만주) → 조선 혁명당·군 / 혁신 의회(북만주) → 한국 독립당·군.'},

function line(l){
  if(typeof l==='object'&&l.cmp){
    const c=l.cmp;
    return `<div class="tbl"><table><thead><tr>${c.cols.map(x=>`<th>${fmt(x)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  if(l.startsWith('H:'))return `</ul><h3>${fmt(l.slice(2))}</h3><ul>`;
  if(l.startsWith('R:'))return `<li class="rline"><span class="red">${fmt(l.slice(2))}</span></li>`;
  if(l.startsWith('G:'))return `<li class="gline">${fmt(l.slice(2))}</li>`;
  if(l.startsWith('T:'))return `<li class="tip">${fmt(l.slice(2))}</li>`;
  return `<li>${fmt(l)}</li>`;
}

const EV=T.filter(e=>e.k);
function genBetween(){
  for(let t=0;t<200;t++){
    const A=EV[Math.floor(Math.random()*EV.length)],Bv=EV[Math.floor(Math.random()*EV.length)];
    const d=Bv.y-A.y; if(d<3||d>9)continue;
    const inside=EV.filter(e=>e.y>A.y&&e.y<Bv.y&&e.k!==A.k&&e.k!==Bv.k);
    const out=EV.filter(e=>(e.y<A.y||e.y>Bv.y));
    if(!inside.length||out.length<4)continue;
    const c=pick(inside,1)[0]; const ds=[]; const seen=new Set([c.k]);
    for(const e of shuf(out)){if(!seen.has(e.k)){seen.add(e.k);ds.push(e)}if(ds.length===4)break}
    if(ds.length<4)continue;
    const all=shuf([c,...ds]);
    return {tg:['연도'],gen:1,q:'(가), (나) 사이 시기에 있었던 사실로 옳은 것은?',ctx:`(가) ${A.t}\n(나) ${Bv.t}`,o:all.map(e=>e.k),a:all.indexOf(c),ex:`(가) ${A.y} ~ (나) ${Bv.y}\n정답: ${c.k} (${c.y})\n${ds.map(e=>`${e.k} ${e.y}`).join(' / ')}`};
  }
}
function genFirst(last){
  const byY={};shuf(EV).forEach(e=>{if(!byY[e.y])byY[e.y]=e});
  const five=pick(Object.values(byY),5);
  const ans=five.reduce((m,e)=>last?(e.y>m.y?e:m):(e.y<m.y?e:m));
  return {tg:['연도'],gen:1,q:`다음 중 가장 ${last?'나중에':'먼저'} 일어난 사건은?`,o:five.map(e=>e.k),a:five.indexOf(ans),ex:five.slice().sort((a,b)=>a.y-b.y).map(e=>`${e.y} ${e.k}`).join('\n')};
}
function genYear(){
  const e=pick(EV.filter(x=>x.s),1)[0];
  const ys=new Set([e.y]);const cands=shuf([-4,-3,-2,-1,1,2,3,4,5,-5]);
  for(const d of cands){const v=e.y+d;if(v>=1910&&v<=1945)ys.add(v);if(ys.size===5)break}
  const o=[...ys].sort((a,b)=>a-b);
  return {tg:['연도'],gen:1,q:'다음 사건이 일어난 해는?',ctx:e.t,o:o.map(v=>v+'년'),a:o.indexOf(e.y),ex:`${e.y}년${e.m?' '+e.m+'월':''} — ${e.t}`};
}
function genSide(){
  const [n,s]=pick(SIDES,1)[0];
  return {tg:['좌우'],gen:1,q:`‘${n}’은(는) 좌파·우파 중 어디에 속할까?`,o:['좌파 (사회주의 계열)','우파 (민족주의 계열)'],a:s==='좌'?0:1,ex:'좌파: 조선 민족 혁명당 → 조선 민족 전선 연맹·조선 의용대 → 조선 독립 동맹·조선 의용군\n우파: 한국 국민당 → 한국 광복 운동 단체 연합회 → 충칭 임시 정부·한국 독립당·한국광복군'};
}
const oxQ=()=>OX.map(([q,a,ex])=>({tg:['OX'],ox:1,q,o:['O','X'],a:a?0:1,ex}));
const bankQ=()=>B.map(b=>({...b}));
function genN(fn,n){const r=[];for(let i=0;i<n;i++){const q=fn();if(q)r.push(q)}return r}

const FOCUS=[['학습지','학습지 빈칸·OX'],['좌우','좌파·우파 구분'],['연도','연도·순서'],['의열단','의열단원 활동'],['구호','17쪽 구호'],['신간회','신간회'],['의용대','조선 의용대'],['단체','운동 단체'],['독립군','한국 독립군 vs 조선 혁명군']];

function buildPool(mode){
  if(mode==='mix'){return shuf([...pick(bankQ(),14),...genN(genBetween,2),genFirst(false),genYear(),...pick(oxQ(),2)]).slice(0,20)}
  if(mode==='order'){return shuf([...genN(genBetween,5),genFirst(false),genFirst(true),genFirst(false),...genN(genYear,4),...bankQ().filter(b=>b.tg.includes('연도')&&b.o[0].includes(' - '))])}
  if(mode==='ox'){return pick(oxQ(),20)}
  if(mode==='wrong'){return shuf(store.get('kh-wrong',[]))}
  if(mode==='red'){return shuf(bankQ().filter(b=>['좌우','의열단','구호','신간회','의용대','단체','독립군'].some(t=>b.tg.includes(t)))).slice(0,20)}
  const tag=mode.slice(2);
  let p=bankQ().filter(b=>b.tg.includes(tag));
  if(tag==='좌우')p=p.concat(genN(genSide,6));
  if(tag==='학습지')p=p.concat(pick(oxQ(),15));
  if(tag==='연도')p=p.concat(genN(genBetween,3),genN(genYear,3));
  return shuf(p);
}

function start(mode){
  const pool=buildPool(mode);
  if(!pool.length){$('#quiz').innerHTML=`<div class="result"><p>오답 노트가 비어 있어요. 다른 모드로 먼저 풀어 보세요.</p><div class="btnrow"><button class="btn dark" id="back">문제 목록으로</button></div></div>`;$('#back').onclick=menu;return}
  S={mode,pool,i:0,score:0};
  render();window.scrollTo(0,0);
}
function render(){
  const q=S.pool[S.i];
  // 보기 없는 객관식은 선택지 섞기
  if(!q._s&&!q.bg&&!q.ox&&!q.gen&&!(q.o[0]||'').includes(' - ')&&q.o.length>2){
    const idx=shuf(q.o.map((_,i)=>i));q.o=idx.map(i=>q.o[i]);q.a=idx.indexOf(q.a);
  }
  q._s=1;
  const tag=q.tg.filter(t=>t!=='기타').join(' · ')||'종합';
  $('#quiz').innerHTML=`
  <div class="qhead"><span>${S.i+1} / ${S.pool.length}</span><button id="quit">그만 풀기</button></div>
  <div class="prog"><i style="width:${(S.i)/S.pool.length*100}%"></i></div>
  <div class="qcard">
    <div class="qtag">${esc(tag)}</div>
    <div class="qtext">${S.i+1}. ${esc(q.q)}</div>
    ${q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:''}
    ${q.bg?`<div class="bogi">${q.bg.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}
    <div class="opts${q.ox||q.o.length===2&&q.o[0]==='O'?' ox':''}">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${q.ox?'':`<span class="no">${q.o.length===2?(i?'②':'①'):CIR[i]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  $('#quit').onclick=menu;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  const q=S.pool[S.i],ok=i===q.a;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  if(ok)S.score++;
  let w=store.get('kh-wrong',[]);
  const key=q._k||(q.q+'|'+(q.ctx||''));
  const clean={...q};delete clean._s;
  if(!ok){if(!w.some(x=>x._k===key)){clean._k=key;w.unshift(clean);w=w.slice(0,120)}}
  else if(S.mode==='wrong'){w=w.filter(x=>x._k!==key)}
  store.set('kh-wrong',w);
  const ansTxt=q.ox?q.o[q.a]:`${q.o.length===2?(q.a?'②':'①'):CIR[q.a]} ${q.o[q.a]}`;
  $('#fb').innerHTML=`<div class="ex${ok?'':' bad'}"><b>${ok?'정답!':'오답 — 정답은 '+esc(ansTxt)}</b>${q.ex?esc(q.ex).replace(/\n/g,'<br>'):''}</div>
  <button class="next" id="next">${S.i+1<S.pool.length?'다음 문제':'결과 보기'}</button>`;
  $('#next').onclick=()=>{S.i++;if(S.i<S.pool.length){render();window.scrollTo(0,0)}else result()};
  $('#next').focus({preventScroll:true});
}
function result(){
  const n=S.pool.length,pt=Math.round(S.score/n*100);
  if(S.mode==='mix'){const b=store.get('kh-best',0);if(pt>b)store.set('kh-best',pt)}
  const w=store.get('kh-wrong',[]).length;
  $('#quiz').innerHTML=`<div class="result"><div class="big">${S.score} / ${n}</div><p>${pt}점 · 오답 노트에 ${w}문제</p>
  <div class="btnrow"><button class="btn dark" id="again">같은 모드 다시</button><button class="btn" id="wr">오답 노트</button><button class="btn" id="mn">문제 목록</button></div></div>`;
  $('#again').onclick=()=>start(S.mode);$('#wr').onclick=()=>start('wrong');$('#mn').onclick=menu;
}
menu();
</script>
</body>
</html>
